services:
  postgres:
    image: postgres:16
    container_name: swachhlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swachhlens}
      POSTGRES_USER: ${POSTGRES_USER:-swachhlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swachhlens}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: